; Shared settings for every environment on this board.
[common]
platform = espressif32
board = esp32-s3-devkitc-1

framework = arduino

; --- Serial Monitor Settings ---
monitor_speed = 921600
; macOS ESP32-S3 native-USB CDC port. Change if your board enumerates elsewhere
; (list with: pio device list). The ADALM-2000 shows up as a separate usbmodem.
monitor_port = /dev/cu.usbmodem1101
monitor_filters = esp32_exception_decoder

; --- Hardware Configuration ---
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv

; --- Build Flags ---
build_flags =
    ; Enables the internal USB CDC (Serial over USB)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Optional: Define your I2C pins here if you want them global
    -D I2C_SDA=8
    -D I2C_SCL=9

; --- Library Dependencies ---
lib_deps =
    bogde/HX711 @ ^0.7.5
    adafruit/Adafruit BME680 Library @ ^2.0.4   ; ambient T/P/RH (self-test)
    mikalhart/TinyGPSPlus @ ^1.0.3              ; GPS NMEA / course (self-test)

; ===== Normal flight / logging firmware (main.cpp) =====
[env:esp32-s3-devkitc-1]
extends = common
; Build everything except the standalone test sketches.
build_src_filter = +<*> -<selftest.cpp>

; ===== PCB hardware self-test (selftest.cpp) =====
; Flash with:  pio run -e selftest -t upload && pio device monitor -e selftest
[env:selftest]
extends = common
; Build only the self-test sketch (excludes main.cpp's setup/loop).
build_src_filter = +<selftest.cpp>
